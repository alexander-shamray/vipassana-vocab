<!doctype html><html lang=ru><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Урок @N@</title>
<style>
:root{--bg:#faf9f6;--fg:#1c1b19;--muted:#6a665f;--line:#ddd8cf;--panel:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#191816;--fg:#ece9e3;--muted:#a09b91;--line:#3a3833;--panel:#24221f}}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 12px}video{width:100%;background:#000;border-radius:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:12px}
.track{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 3.5em;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.track:last-child{border-bottom:0}.track input[type=range]{width:100%}.track input[type=range]:disabled{opacity:.35}
.on{cursor:pointer}output{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
p{color:var(--muted);font-size:.9rem;margin:10px 0 0}
@media (max-width:520px){.track{grid-template-columns:1fr 3em}.track input[type=range]{grid-column:1/3;grid-row:2}}
</style>
<h1>@TITLE@</h1>
<video id=v controls preload=metadata muted src=video.mp4></video>
<div class=panel>@ROWS@</div>
<p>Галочка включает дорожку, ползунок задаёт её громкость. Звук самого видео отключён: все голоса идут через эти дорожки. Настройки запоминаются. Пробел: пауза.</p>
<p><label class=on><input type=checkbox id=split> Разделить по наушникам: оригинал слева, русский справа</label> <span id=split-note></span></p>
<script>
const v = document.getElementById('v');
const tracks = [...document.querySelectorAll('audio[data-track]')];
const key = 'lesson@N@-mix';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {} };
// Web Audio routes each track to one ear. Once wired, an element plays only through the graph, so turning the split off
// centres the sound instead of unwiring. Browsers send silence for media opened from file://, so there it stays off.
const split = document.getElementById('split');
const canSplit = location.protocol !== 'file:' && 'AudioContext' in window;
const graph = new Map();
window.playerGraph = graph;
let audio = null;
function wire() {
  if (audio) return;
  audio = new AudioContext();
  tracks.forEach(a => {
    const gain = audio.createGain();
    const pan = audio.createStereoPanner();
    audio.createMediaElementSource(a).connect(gain).connect(pan).connect(audio.destination);
    graph.set(a.dataset.track, {gain, pan});
  });
}
// A browser keeps the graph asleep until a touch or a key press.
const wake = () => { if (audio && audio.state === 'suspended') audio.resume().catch(() => {}); };
['pointerdown', 'touchend', 'click', 'keydown'].forEach(e => document.addEventListener(e, wake, true));
function apply(id) {
  const a = document.querySelector(`audio[data-track="${id}"]`);
  const on = document.querySelector(`[data-on="${id}"]`);
  const vol = document.querySelector(`[data-vol="${id}"]`);
  a.muted = !on.checked;
  const wired = graph.get(id);
  if (wired) wired.gain.gain.value = vol.value / 100; // the gain also works on iPhone, where a.volume is read-only
  a.volume = wired ? 1 : vol.value / 100;
  vol.disabled = !on.checked;
  document.querySelector(`[data-out="${id}"]`).textContent = on.checked ? vol.value + '%' : 'выкл';
  saved[id] = {on: on.checked, vol: +vol.value};
  save();
}
tracks.forEach(a => {
  const id = a.dataset.track;
  const on = document.querySelector(`[data-on="${id}"]`);
  const vol = document.querySelector(`[data-vol="${id}"]`);
  if (saved[id]) { on.checked = saved[id].on; vol.value = saved[id].vol; }
  on.addEventListener('change', () => apply(id));
  vol.addEventListener('input', () => apply(id));
  apply(id);
});
function applySplit() {
  if (split.checked) wire();
  graph.forEach((g, id) => { g.pan.pan.value = !split.checked ? 0 : id === 'english' ? -1 : 1; });
  tracks.forEach(a => apply(a.dataset.track));
  saved.split = split.checked;
  save();
}
split.disabled = !canSplit;
split.checked = canSplit && saved.split !== false;
if (!canSplit) document.getElementById('split-note').textContent = 'Работает, только если открыть плеер через dub serve.';
split.addEventListener('change', () => { wake(); applySplit(); });
applySplit();
const seekAll = () => tracks.forEach(a => { a.currentTime = Math.min(v.currentTime, a.duration || Infinity); });
const playAll = () => { wake(); seekAll(); tracks.forEach(a => { a.playbackRate = v.playbackRate; a.play().catch(() => {}); }); };
const pauseAll = () => tracks.forEach(a => a.pause());
v.addEventListener('play', playAll);
v.addEventListener('playing', playAll);
v.addEventListener('pause', pauseAll);
v.addEventListener('waiting', pauseAll);
v.addEventListener('seeked', () => { seekAll(); if (!v.paused) playAll(); });
v.addEventListener('ratechange', () => tracks.forEach(a => { a.playbackRate = v.playbackRate; }));
v.addEventListener('ended', pauseAll);
// Keep the tracks on the video's clock: nudge small drift, jump on a large one.
setInterval(() => {
  if (v.paused || v.seeking) return;
  tracks.forEach(a => {
    if (a.paused || a.ended) return;
    const d = a.currentTime - v.currentTime;
    if (Math.abs(d) > 0.3) { a.currentTime = v.currentTime; a.playbackRate = v.playbackRate; }
    else if (Math.abs(d) > 0.04) a.playbackRate = v.playbackRate * (d > 0 ? 0.97 : 1.03);
    else a.playbackRate = v.playbackRate;
  });
}, 400);
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.target === v || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  v.paused ? v.play() : v.pause();
});
</script>
</html>
