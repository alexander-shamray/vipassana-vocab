# Fly.io app: one small machine in Singapore with a volume for SQLite.
app = "vipassana-vocab"
primary_region = "sin"

[build]
  dockerfile = "app/Dockerfile"

[env]
  DATABASE_PATH = "/data/app.sqlite"
  PORT = "8080"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
