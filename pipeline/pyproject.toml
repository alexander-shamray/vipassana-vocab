[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vv-pipeline"
version = "0.1.0"
description = "Builds the Vipassana Vocab dictionary from the talks"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
# Heavy, GPU and network dependencies: only needed to actually run the pipeline.
run = [
    # [default] brings yt-dlp-ejs; deno is the JavaScript runtime YouTube
    # extraction now needs (without it some downloads fail with HTTP 403).
    "yt-dlp[default]>=2025.1",
    "deno>=2",
    "faster-whisper>=1.1",
    # faster-whisper 1.2 passes av.open(metadata_errors=...), removed in PyAV 15+.
    "av>=12,<15",
    # CUDA 12 cuBLAS and cuDNN 9 for CTranslate2 (no macOS builds exist).
    # transcribe.use_pip_cuda puts them on PATH on Windows; on Linux export
    # LD_LIBRARY_PATH, see pipeline/README.md.
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
    "spacy>=3.8",
    "anthropic>=0.70",
    "boto3>=1.35",
]
# Local pronunciations (the default TTS engine). Install a CUDA build of torch
# first, see pipeline/README.md.
kokoro = ["kokoro>=0.9.4", "soundfile>=0.12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vv-pipeline = "vv_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["vv_pipeline*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
