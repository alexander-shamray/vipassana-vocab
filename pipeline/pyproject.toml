[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vv-pipeline"
version = "0.1.0"
description = "Builds the Vipassana Vocab dictionary from the talks"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
# Heavy, GPU and network dependencies: only needed to actually run the pipeline.
run = [
    "yt-dlp>=2025.1",
    "faster-whisper>=1.1",
    "spacy>=3.8",
    "anthropic>=0.70",
    "boto3>=1.35",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vv-pipeline = "vv_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["vv_pipeline*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
