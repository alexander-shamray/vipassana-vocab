# Pali words heard in the talks.
# display  — spelling shown on the site (with diacritics)
# variants — other forms of the word the speaker may use on purpose (Sanskrit,
#            Hindi, English: dharma, karma, nirvana); quotes keep them as said
# misheard — spellings Whisper wrote for the Pali word itself (sheila, panya);
#            quotes are respelled with `display`. Plain ASCII (samadhi) and an
#            English plural (sankharas) are respelled without being listed.
# ru       — Russian meanings, first one is the sense used in the talks
# ipa      — optional pronunciation override; otherwise derived from `display`
# reviewed — set to true once the owner has checked the Russian; until then the
#            site marks the translation as a draft
