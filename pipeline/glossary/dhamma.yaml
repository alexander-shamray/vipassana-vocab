# English words Goenka uses as Dhamma terms. A plain dictionary sense would
# mislead here (sensation = vedanā, not "a sensation in the press"), so these
# are translated from this list and reviewed by the owner, never by the LLM.
# Same fields as pali.yaml; variants list the forms that map to the term.
- {display: sensation, variants: [sensations], ru: ["ощущение (телесное, ведана)"], reviewed: false}
- {display: equanimity, variants: [], ru: [уравновешенность, невозмутимость], reviewed: false}
- {display: craving, variants: [cravings], ru: [влечение, страстное желание, жажда], reviewed: false}
- {display: aversion, variants: [aversions], ru: [отвращение, неприязнь], reviewed: false}
- {display: ignorance, variants: [], ru: [неведение], reviewed: false}
