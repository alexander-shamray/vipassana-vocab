name: deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "dictionary/**", "fly.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read

jobs:
  deploy:
    # Set the repository variable DEPLOY_ENABLED=true once docs/deploy.md is done.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dictionary exists
        run: test -s dictionary/words.jsonl
      - name: Fetch examples from the private R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "s3://${{ secrets.R2_PRIVATE_BUCKET }}/examples.jsonl" dictionary/examples.jsonl \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" || echo "::warning::no examples.jsonl in R2 yet"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
